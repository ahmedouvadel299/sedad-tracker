        '<td style="direction:ltr; text-align:right;">'+escapeHtml(c.phone||'—')+'</td>'+
        '<td>'+FR_TEAM_LABEL_SHORT[c.listType]+'</td><td>'+(c.actionDate||'')+'</td>'+
        '<td style="direction:ltr; text-align:right;">'+(c.actionAt?fmtTime(c.actionAt):'—')+'</td>'+
        '<td>'+fmtDurationFr(c.callDurationSeconds)+(c.autoTimed===false?' <span style="color:#B5514B;">⚠ '+RL.manual+'</span>':'')+'</td>'+
        '<td>'+frStatus(c.status)+'</td>'+
        '<td>'+(c.reason?escapeHtml(c.status==='failed'?frReason(c.reason):c.reason):'—')+'</td>';
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    var twrap=el('<div class="preview-table-wrap" style="max-height:none;"></div>');
    twrap.appendChild(tbl);
    tableCard.appendChild(twrap);
  }
  printArea.appendChild(tableCard);

  if(reasonEntries.length>0){
    var reasonsCard=el('<div class="card" style="margin-top:14px;"></div>');
    reasonsCard.appendChild(el('<div class="section-title">'+RL.commonReasons+'</div>'));
    var maxR=reasonEntries[0].count;
    reasonEntries.forEach(function(e2){
      var pct=Math.round((e2.count/maxR)*100);
      var row=el('<div class="reason-bar-row"></div>');
      row.appendChild(el('<div class="rlabel">'+escapeHtml(frReason(e2.reason))+'</div>'));
      row.appendChild(el('<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%; background:#B5514B;"></div></div>'));
      row.appendChild(el('<div class="rcount">'+fmtNum(e2.count)+'</div>'));
      reasonsCard.appendChild(row);
    });
    printArea.appendChild(reasonsCard);
  }

  if(manualEntries.length>0){
    var manualCard=el('<div class="card" style="margin-top:14px;"></div>');
    manualCard.appendChild(el('<div class="section-title">'+RL.manualExtra+'</div>'));
    var mtbl=document.createElement('table');
    mtbl.innerHTML='<thead><tr><th>'+RL.agentCol+'</th><th>'+RL.date+'</th><th>'+RL.count+'</th></tr></thead>';
    var mtbody=document.createElement('tbody');
    manualEntries.forEach(function(e){
      var agent=getUser(e.userId);
      var tr=document.createElement('tr');
      tr.innerHTML='<td>'+(agent?escapeHtml(agent.name):'—')+'</td><td>'+e.date+'</td><td>'+fmtNum(e.count)+'</td>';
      mtbody.appendChild(tr);
    });
    mtbl.appendChild(mtbody);
    manualCard.appendChild(mtbl);
    printArea.appendChild(manualCard);
  }

  printArea.appendChild(renderSignatureBlock());
  container.appendChild(printArea);

  container.appendChild(reportActionButtons(
    function(){ window.print(); },
    function(){
      var admin = STATE.users.find(function(u){ return u.role==='admin'; });
      var aoa=[[BANK_NAME_FR],[titleText],[],
        [RL.totalNonValide, actTot],[RL.totalInactif, useTot],
        [RL.successCount, successCount],[RL.failedCount, failCount],
        [],[RL.agentCol, RL.name, RL.phone, RL.type, RL.date, RL.time, RL.duration, RL.status, RL.reason]
      ];
      contacts.slice().sort(function(a,b){ return (a.actionAt||'').localeCompare(b.actionAt||''); }).forEach(function(c){
        var agent=getUser(c.assignedTo);
        aoa.push([
          agent?agent.name:'', c.name||'', c.phone||'', FR_TEAM_LABEL_SHORT[c.listType]||'',
          c.actionDate||'', c.actionAt?fmtTime(c.actionAt):'', fmtDurationFr(c.callDurationSeconds)+(c.autoTimed===false?' ('+RL.manual+')':''),
          frStatus(c.status), c.reason?(c.status==='failed'?frReason(c.reason):c.reason):''
        ]);
      });
      if(manualEntries.length>0){
        aoa.push([]); aoa.push([RL.manualExtra]); aoa.push([RL.agentCol, RL.date, RL.count]);
        manualEntries.forEach(function(e){ var agent=getUser(e.userId); aoa.push([agent?agent.name:'', e.date, e.count]); });
      }
      aoa.push([]); aoa.push([RL.signatureCenterHead, admin?admin.name:'']); aoa.push([RL.signatureDirector, STATE.settings.directorName||'']);
      exportAoaToExcel(fileSlug+'.xlsx', titleText.slice(0,28), aoa);
    }
  ));

  return container;
}

function renderIndividualReport(){
  var container=el('<div></div>');
  var agents=agentsOnly();
  var pickCard=el('<div class="card" style="margin-bottom:14px;"></div>');
  pickCard.appendChild(el('<div class="section-title">Choisir l\'agent et la période</div>'));
  var agentSel=document.createElement('select');
  agentSel.appendChild(el('<option value="">— Choisir un agent —</option>'));
  agents.slice().sort(function(a,b){ return a.name.localeCompare(b.name,'ar'); }).forEach(function(a){
    var o=document.createElement('option'); o.value=a.id; o.textContent=a.name+' ('+TEAM_LABEL[a.team]+')';
    if(STATE.reportAgentId===a.id) o.selected=true;
    agentSel.appendChild(o);
  });
  agentSel.onchange=function(){ STATE.reportAgentId=agentSel.value||null; render(); };
  var f1=el('<div class="field"></div>'); f1.appendChild(agentSel); pickCard.appendChild(f1);

  var periodSel=document.createElement('select');
  periodSel.innerHTML='<option value="month">Rapport mensuel</option><option value="day">Rapport journalier</option><option value="range">Période personnalisée</option>';
  periodSel.value=STATE.reportPeriodType;
  periodSel.onchange=function(){ STATE.reportPeriodType=periodSel.value; render(); };
  var f2=el('<div class="field"></div>'); f2.appendChild(periodSel); pickCard.appendChild(f2);

  if(STATE.reportPeriodType==='day'){
    var dIn=document.createElement('input'); dIn.type='date'; dIn.value=STATE.reportDate||todayStr();
    dIn.onchange=function(){ STATE.reportDate=dIn.value; render(); };
    pickCard.appendChild(dIn);
  } else if(STATE.reportPeriodType==='range'){
    var sIn=document.createElement('input'); sIn.type='date'; sIn.value=STATE.reportRangeStart||todayStr();
    sIn.onchange=function(){ STATE.reportRangeStart=sIn.value; render(); };
    var eIn=document.createElement('input'); eIn.type='date'; eIn.value=STATE.reportRangeEnd||todayStr();
    eIn.onchange=function(){ STATE.reportRangeEnd=eIn.value; render(); };
    var rf1=el('<div class="field"><label>Date de début</label></div>'); rf1.appendChild(sIn);
    var rf2=el('<div class="field"><label>Date de fin</label></div>'); rf2.appendChild(eIn);
    pickCard.appendChild(rf1); pickCard.appendChild(rf2);
  } else {
    var mIn=document.createElement('input'); mIn.type='month'; mIn.value=STATE._reportMonth||currentMonthKey();
    mIn.onchange=function(){ STATE._reportMonth=mIn.value; render(); };
    pickCard.appendChild(mIn);
  }
  container.appendChild(pickCard);

  if(!STATE.reportAgentId){
    container.appendChild(el('<div class="empty-state"><div class="icon">👤</div><div>Choisissez un agent pour voir son rapport détaillé</div></div>'));
    return container;
  }
  var agent=getUser(STATE.reportAgentId);
  if(!agent){ container.appendChild(el('<div class="faint">Cet agent n\'existe plus</div>')); return container; }

  var contacts, periodLabelFr, manualEntries, startDate, endDate;
  if(STATE.reportPeriodType==='day'){
    var date=STATE.reportDate||todayStr();
    startDate=date; endDate=date;
    contacts=contactsOnDate(date, agent.id);
    periodLabelFr=date;
    manualEntries=STATE.entries.filter(function(e){ return e.userId===agent.id && e.date===date && e.count>0; });
  } else if(STATE.reportPeriodType==='range'){
    startDate=STATE.reportRangeStart||todayStr(); endDate=STATE.reportRangeEnd||todayStr();
    if(startDate>endDate){ container.appendChild(el('<div class="error-msg">La date de début doit précéder la date de fin</div>')); return container; }
    contacts=contactsInRange(startDate, endDate, agent.id);
    periodLabelFr=startDate+' → '+endDate;
    manualEntries=manualEntriesInRange(startDate, endDate, agent.id);
  } else {
    var month=STATE._reportMonth||currentMonthKey();
    startDate=month+'-01'; endDate=month+'-31';
    contacts=contactsForAgentMonth(agent.id, month);
    periodLabelFr=frMonthLabel(month);
    manualEntries=STATE.entries.filter(function(e){ return e.userId===agent.id && monthKey(e.date)===month && e.count>0; });
  }

  var printArea=el('<div class="report-print"></div>');
  printArea.appendChild(el(
    '<div class="faint" style="font-size:11.5px;">'+escapeHtml(BANK_NAME_FR)+'</div>'+
    '<div class="section-title" style="font-size:15px;">'+RL.individualTitle+' — '+escapeHtml(agent.name)+'</div>'+
    '<div class="faint" style="margin-bottom:12px;">'+frRoleLabel(agent)+' — '+escapeHtml(periodLabelFr)+'</div>'
  ));

  var successCount=contacts.filter(function(c){ return c.status==='success'; }).length;
  var failCount=contacts.filter(function(c){ return c.status==='failed'; }).length;
  var manualTotal=manualEntries.reduce(function(s,e){ return s+e.count; }, 0);
  var callSecs = STATE.reportPeriodType==='day' ? agentCallSecondsOnDate(agent.id, startDate)
    : STATE.reportPeriodType==='range' ? callSecondsInRange(agent.id, startDate, endDate)
    : agentCallSecondsInMonth(agent.id, startDate.slice(0,7));
  var statCard=el('<div class="card" style="margin-bottom:14px;"></div>');
  statCard.appendChild(el(
    '<div class="stat-grid">'+
    '<div class="stat-card"><div class="num" style="color:#5AA57C;">'+fmtNum(successCount)+'</div><div class="lbl">'+RL.successCount+'</div></div>'+
    '<div class="stat-card"><div class="num" style="color:#B5514B;">'+fmtNum(failCount)+'</div><div class="lbl">'+RL.failedCount+'</div></div>'+
    '<div class="stat-card"><div class="num">'+fmtNum(manualTotal)+'</div><div class="lbl">'+RL.manualExtra+'</div></div>'+
    '<div class="stat-card"><div class="num">'+fmtDurationFr(callSecs)+'</div><div class="lbl">'+RL.callTime+'</div></div>'+
    '</div>'
  ));
  printArea.appendChild(statCard);

  var tableCard=el('<div class="card"></div>');
  tableCard.appendChild(el('<div class="section-title">'+RL.contactDetails+'</div>'));
  if(contacts.length===0){
    tableCard.appendChild(el('<div class="faint">'+RL.noData+'</div>'));
  } else {
    var tbl=document.createElement('table');
    tbl.innerHTML='<thead><tr><th>'+RL.name+'</th><th>'+RL.phone+'</th><th>'+RL.type+'</th><th>'+RL.date+'</th><th>'+RL.time+'</th><th>'+RL.duration+'</th><th>'+RL.status+'</th><th>'+RL.reason+'</th></tr></thead>';
    var tbody=document.createElement('tbody');
    contacts.slice().sort(function(a,b){ return (a.actionAt||'').localeCompare(b.actionAt||''); }).forEach(function(c){
      var tr=document.createElement('tr');
      tr.innerHTML='<td>'+escapeHtml(c.name||'—')+'</td><td style="direction:ltr; text-align:right;">'+escapeHtml(c.phone||'—')+'</td>'+
        '<td>'+FR_TEAM_LABEL_SHORT[c.listType]+'</td><td>'+(c.actionDate||'')+'</td>'+
        '<td style="direction:ltr; text-align:right;">'+(c.actionAt?fmtTime(c.actionAt):'—')+'</td>'+
        '<td>'+fmtDurationFr(c.callDurationSeconds)+(c.autoTimed===false?' <span style="color:#B5514B;">⚠</span>':'')+'</td>'+
        '<td>'+frStatus(c.status)+'</td>'+
        '<td>'+(c.reason?escapeHtml(c.status==='failed'?frReason(c.reason):c.reason):'—')+'</td>';
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    var twrap=el('<div class="preview-table-wrap" style="max-height:none;"></div>');
    twrap.appendChild(tbl);
    tableCard.appendChild(twrap);
  }
  printArea.appendChild(tableCard);

  if(failCount>0){
    var reasonsCard=el('<div class="card" style="margin-top:14px;"></div>');
    reasonsCard.appendChild(el('<div class="section-title">'+RL.commonReasons+'</div>'));
    var rmap={};
    contacts.forEach(function(c){ if(c.status==='failed'){ rmap[c.reason]=(rmap[c.reason]||0)+1; } });
    var rentries=Object.keys(rmap).map(function(k){ return {reason:k, count:rmap[k]}; }).sort(function(a,b){ return b.count-a.count; });
    var maxR=rentries[0].count;
    rentries.forEach(function(e2){
      var pct=Math.round((e2.count/maxR)*100);
      var row=el('<div class="reason-bar-row"></div>');
      row.appendChild(el('<div class="rlabel">'+escapeHtml(frReason(e2.reason))+'</div>'));
      row.appendChild(el('<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%; background:#B5514B;"></div></div>'));
      row.appendChild(el('<div class="rcount">'+fmtNum(e2.count)+'</div>'));
      reasonsCard.appendChild(row);
    });
    printArea.appendChild(reasonsCard);
  }

  printArea.appendChild(renderSignatureBlock());
  container.appendChild(printArea);

  container.appendChild(reportActionButtons(
    function(){ window.print(); },
    function(){
      var admin = STATE.users.find(function(u){ return u.role==='admin'; });
      var aoa=[[BANK_NAME_FR],[RL.individualTitle+' — '+agent.name+' ('+frRoleLabel(agent)+')'],[periodLabelFr],[],
        [RL.successCount, successCount],[RL.failedCount, failCount],[RL.manualExtra, manualTotal],[RL.callTime, fmtDurationFr(callSecs)],
        [],[RL.name, RL.phone, RL.type, RL.date, RL.time, RL.duration, RL.status, RL.reason]
      ];
      contacts.slice().sort(function(a,b){ return (a.actionAt||'').localeCompare(b.actionAt||''); }).forEach(function(c){
        aoa.push([c.name||'', c.phone||'', FR_TEAM_LABEL_SHORT[c.listType]||'', c.actionDate||'', c.actionAt?fmtTime(c.actionAt):'',
          fmtDurationFr(c.callDurationSeconds)+(c.autoTimed===false?' ('+RL.manual+')':''), frStatus(c.status), c.reason?(c.status==='failed'?frReason(c.reason):c.reason):'']);
      });
      aoa.push([]); aoa.push([RL.signatureCenterHead, admin?admin.name:'']); aoa.push([RL.signatureDirector, STATE.settings.directorName||'']);
      exportAoaToExcel('rapport-individuel-'+agent.name.replace(/\s+/g,'-')+'.xlsx', RL.individualTitle, aoa);
    }
  ));

  return container;
}

function arabicMonthLabel(ym){
  var names=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  var parts=ym.split('-');
  return names[parseInt(parts[1])-1]+' '+parts[0];
}

function renderSettingsTab(){
  var container=el('<div></div>');
  var wrap=el('<div class="card"></div>');
  wrap.appendChild(el('<div class="section-title">Paramètres des objectifs</div>'));

  function numField(labelText, value, onSave){
    var f=el('<div class="field"></div>');
    f.appendChild(el('<label>'+labelText+'</label>'));
    var i=document.createElement('input');
    i.type='number'; i.value=value;
    i.onchange=function(){ onSave(parseInt(i.value)||0); };
    f.appendChild(i);
    return f;
  }
  function textField(labelText, value, onSave){
    var f=el('<div class="field"></div>');
    f.appendChild(el('<label>'+labelText+'</label>'));
    var i=document.createElement('input');
    i.type='text'; i.value=value||'';
    i.onchange=function(){ onSave(i.value.trim()); };
    f.appendChild(i);
    return f;
  }

  wrap.appendChild(numField('Objectif quotidien — Groupe non valide (par agent)', STATE.settings.dailyTargetActivation, async function(v){ STATE.settings.dailyTargetActivation=v; await saveSettings(); showToast('Mis à jour'); }));
  wrap.appendChild(numField('Objectif quotidien — Groupe inactif (par agent)', STATE.settings.dailyTargetUsage, async function(v){ STATE.settings.dailyTargetUsage=v; await saveSettings(); showToast('Mis à jour'); }));
  wrap.appendChild(numField('Objectif mensuel — Groupe non valide (équipe entière)', STATE.settings.monthlyTargetTeamActivation, async function(v){ STATE.settings.monthlyTargetTeamActivation=v; await saveSettings(); showToast('Mis à jour'); }));
  wrap.appendChild(numField('Objectif mensuel — Groupe inactif (équipe entière)', STATE.settings.monthlyTargetTeamUsage, async function(v){ STATE.settings.monthlyTargetTeamUsage=v; await saveSettings(); showToast('Mis à jour'); }));
  wrap.appendChild(el('<hr class="rule">'));
  wrap.appendChild(textField('Nom du directeur SEDAD (apparaît dans la signature des rapports imprimés)', STATE.settings.directorName, async function(v){ STATE.settings.directorName=v; await saveSettings(); showToast('Mis à jour'); }));

  wrap.appendChild(el('<hr class="rule">'));
  wrap.appendChild(el('<div class="faint" style="font-size:12px;">Remarque : ces données sont partagées entre toutes les personnes qui ouvrent cette application et se connectent. Vous pouvez modifier l\'objectif individuel de chaque agent depuis l\'onglet « Équipe » si besoin.</div>'));
  container.appendChild(wrap);

  // ---- rebuild per-agent index (one-time / on-demand data-savings feature) ----
  var idxCard=el('<div class="card" style="margin-top:14px;"></div>');
  idxCard.appendChild(el(
    '<div class="section-title">Optimisation des données pour les agents</div>'+
    '<div class="faint" style="font-size:11.5px; margin-bottom:10px;">Reconstruit un index séparé par agent afin que chaque agent ne télécharge que ses propres contacts (au lieu de toute l\'équipe) — économise énormément de données mobiles. À exécuter une fois maintenant, puis à nouveau seulement si des données semblent désynchronisées.</div>'
  ));
  var idxBtn=el('<button class="btn block">Reconstruire l\'index maintenant</button>');
  idxBtn.onclick=async function(){
    idxBtn.disabled=true; idxBtn.textContent='Reconstruction en cours…';
    try{
      var rawAll = await dbGet('calllists');
      var all = dedupeCalllistsRaw(rawAll);
      var byAgent={};
      all.forEach(function(c){
        if(c.assignedTo){ byAgent[c.assignedTo]=byAgent[c.assignedTo]||{}; byAgent[c.assignedTo][c.id]=c; }
      });
      var agentIds = agentsOnly().map(function(a){ return a.id; });
      for(var i=0;i<agentIds.length;i++){
        await dbSet('calllists_by_agent/'+agentIds[i], byAgent[agentIds[i]]||null);
      }
      showToast('Index reconstruit ✓ ('+agentIds.length+' agents)');
    }catch(e){
      showToast('Échec de la reconstruction, vérifiez la connexion et réessayez');
    }
    idxBtn.disabled=false; idxBtn.textContent='Reconstruire l\'index maintenant';
  };
  idxCard.appendChild(idxBtn);
  container.appendChild(idxCard);

  // ---- legacy manual-entry cleanup (old removed "manual add" feature) ----
  var monthKeyNow = currentMonthKey();
  var agentsWithManual = agentsOnly().map(function(a){
    var monthTotalVal = monthTotal(a.id, monthKeyNow);
    return {agent:a, total:monthTotalVal};
  }).filter(function(x){ return x.total>0; });

  if(agentsWithManual.length>0){
    var cleanCard=el('<div class="card" style="margin-top:14px; border-color:var(--danger);"></div>');
    cleanCard.appendChild(el(
      '<div class="section-title">Anciennes entrées manuelles ('+arabicMonthLabel(monthKeyNow)+')</div>'+
      '<div class="faint" style="font-size:11.5px; margin-bottom:10px;">Ces totaux proviennent de l\'ancien compteur manuel (retiré depuis) et restent comptabilisés dans les statistiques. Réinitialisez-les si nécessaire.</div>'
    ));
    agentsWithManual.forEach(function(x){
      var row=el('<div class="agent-list-item"></div>');
      row.appendChild(el('<div class="meta"><div class="aname">'+escapeHtml(x.agent.name)+'</div><div class="faint" style="font-size:11.5px;">'+fmtNum(x.total)+' entrée(s) manuelle(s) ce mois-ci</div></div>'));
      var resetBtn=el('<button class="btn danger" style="padding:7px 12px; font-size:12px;">Réinitialiser</button>');
      resetBtn.onclick=async function(){
        if(!confirm('Remettre à zéro les entrées manuelles de '+x.agent.name+' pour ce mois-ci ?')) return;
        STATE.entries = STATE.entries.filter(function(e){ return !(e.userId===x.agent.id && monthKey(e.date)===monthKeyNow); });
        await saveEntries();
        showToast('Réinitialisé ✓');
        render();
      };
      row.appendChild(resetBtn);
      cleanCard.appendChild(row);
    });
    container.appendChild(cleanCard);
  }

  return container;
}

/* ============================== INIT ============================== */
async function init(){
  render();
  await loadAll();
  render();
  startAllLiveSync();
}
init();

})();
</script>
