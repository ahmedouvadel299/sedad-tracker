<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Registre SEDAD — Suivi de l'équipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0D1A17;
    --surface:#16261F;
    --surface-2:#1D2F26;
    --surface-3:#25392E;
    --border:#2C4136;
    --text:#F2E9D8;
    --text-dim:#A9BDB2;
    --text-faint:#71877C;
    --accent:#E0B23A;
    --accent-soft:#3D3315;
    --activation:#6FBF8B;
    --activation-soft:#1B3025;
    --usage:#E0B23A;
    --usage-soft:#3D3315;
    --danger:#E08677;
    --danger-soft:#3A2320;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(224,178,58,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 20%, rgba(111,191,139,0.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'El Messiri', 'IBM Plex Sans Arabic', sans-serif; }
  #app{ min-height:100vh; display:flex; flex-direction:column; }
  ::selection{ background:var(--accent); color:#1a1509; }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-bottom:1px solid var(--border);
    background:rgba(22,36,31,0.7); backdrop-filter:blur(6px);
    position:sticky; top:0; z-index:20;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{
    width:34px; height:34px; border-radius:8px;
    background:linear-gradient(145deg, var(--accent), #9c7c17);
    display:flex; align-items:center; justify-content:center;
    font-family:'El Messiri', serif; font-weight:700; color:#1a1509; font-size:16px;
  }
  .brand .name{ font-family:'El Messiri', serif; font-weight:700; font-size:17px; letter-spacing:.2px; }
  .brand .sub{ font-size:11px; color:var(--text-dim); margin-top:-2px; }
  .whoami{ display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-dim); }
  .whoami b{ color:var(--text); font-weight:600; }
  .logout-btn{
    background:none; border:1px solid var(--border); color:var(--text-dim);
    padding:6px 12px; border-radius:20px; font-size:12px; cursor:pointer;
    font-family:inherit;
  }
  .logout-btn:hover{ border-color:var(--danger); color:var(--danger); }

  main{ flex:1; width:100%; max-width:920px; margin:0 auto; padding:20px 16px 60px; }

  /* ---------- generic ---------- */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px;
  }
  .muted{ color:var(--text-dim); }
  .faint{ color:var(--text-faint); }
  .row{ display:flex; align-items:center; gap:10px; }
  .grid{ display:grid; gap:14px; }
  .btn{
    font-family:inherit; border:none; cursor:pointer; border-radius:10px;
    padding:12px 18px; font-size:14px; font-weight:600;
    background:var(--accent); color:#1a1509;
  }
  .btn:active{ transform:translateY(1px); }
  .btn.secondary{ background:var(--surface-3); color:var(--text); border:1px solid var(--border); }
  .btn.ghost{ background:none; color:var(--text-dim); border:1px dashed var(--border); }
  .btn.danger{ background:var(--danger-soft); color:#f0b3ae; border:1px solid var(--danger); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.block{ width:100%; }
  input, select{
    font-family:inherit; background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); padding:11px 13px; border-radius:10px; font-size:14px; width:100%;
  }
  input:focus, select:focus{ outline:none; border-color:var(--accent); }
  label{ font-size:12px; color:var(--text-dim); display:block; margin-bottom:6px; }
  .field{ margin-bottom:14px; }
  .tag{
    display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px;
    font-size:11px; font-weight:600;
  }
  .tag.activation{ background:var(--activation-soft); color:var(--activation); }
  .tag.usage{ background:var(--usage-soft); color:var(--usage); }
  .tag.role{ background:var(--surface-3); color:var(--text-dim); }
  .error-msg{ background:var(--danger-soft); color:#f0b3ae; padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:14px; }
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--surface-3); border:1px solid var(--accent); color:var(--text);
    padding:10px 20px; border-radius:30px; font-size:13px; z-index:100;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ padding:10px 8px; text-align:right; border-bottom:1px solid var(--border); }
  th{ color:var(--text-dim); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
  tbody tr:hover{ background:rgba(255,255,255,0.02); }
  .tabs{ display:flex; gap:6px; margin-bottom:18px; overflow-x:auto; }
  .tab{
    padding:9px 16px; border-radius:20px; font-size:13px; cursor:pointer;
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim); white-space:nowrap;
  }
  .tab.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600; }
  .section-title{ font-size:13px; color:var(--text-dim); margin-bottom:12px; letter-spacing:.02em; }
  .bar-track{ height:8px; border-radius:6px; background:var(--surface-2); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:6px; transition:width .4s ease; }
  hr.rule{ border:none; border-top:1px dashed var(--border); margin:16px 0; }

  /* ---------- login ---------- */
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .stamp-card{
    width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border);
    border-radius:20px; padding:32px 26px; position:relative; overflow:hidden;
  }
  .stamp-card::before{
    content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 85% -10%, rgba(201,162,39,0.10), transparent 45%);
    pointer-events:none;
  }
  .stamp-ring{ width:78px; height:78px; margin:0 auto 16px; position:relative; }
  .login-title{ text-align:center; font-size:20px; font-weight:700; margin-bottom:4px; }
  .login-sub{ text-align:center; font-size:12.5px; color:var(--text-dim); margin-bottom:26px; }
  .pin-dots{ display:flex; gap:10px; justify-content:center; direction:ltr; margin:6px 0 2px; }
  .pin-dots span{
    width:13px; height:13px; border-radius:50%; border:1.5px solid var(--border); background:none;
  }
  .pin-dots span.filled{ background:var(--accent); border-color:var(--accent); }
  .keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; direction:ltr; }
  .keypad button{
    font-family:inherit; padding:16px 0; border-radius:12px; background:var(--surface-2);
    border:1px solid var(--border); color:var(--text); font-size:18px; cursor:pointer;
  }
  .keypad button:active{ background:var(--surface-3); }
  .keypad button.wide{ font-size:13px; color:var(--text-dim); }

  /* ---------- stat cards ---------- */
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  .stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
  .stat-card .num{ font-family:'El Messiri', serif; font-size:26px; font-weight:700; }
  .stat-card .lbl{ font-size:11.5px; color:var(--text-dim); margin-top:2px; }

  /* ---------- agent big counter ---------- */
  .counter-card{ text-align:center; padding:26px 18px; }
  .ring-wrap{ width:190px; height:190px; margin:0 auto 14px; position:relative; }
  .ring-center{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .ring-center .val{ font-family:'El Messiri', serif; font-size:40px; font-weight:700; }
  .ring-center .of{ font-size:11.5px; color:var(--text-dim); margin-top:2px; }
  .stepper{ display:flex; align-items:center; justify-content:center; gap:16px; margin:18px 0 12px; }
  .stepper button{
    width:52px; height:52px; border-radius:50%; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text); font-size:22px; cursor:pointer; font-family:inherit;
  }
  .stepper input{
    width:90px; text-align:center; font-size:24px; font-family:'El Messiri', serif; font-weight:700;
    padding:10px 4px; -moz-appearance:textfield;
  }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }

  .history-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .history-row:last-child{ border-bottom:none; }
  .history-row .d{ width:78px; color:var(--text-dim); font-size:12px; }
  .history-row .bar-track{ flex:1; }
  .history-row .v{ width:34px; text-align:left; direction:ltr; font-weight:600; }

  .agent-list-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 4px; border-bottom:1px solid var(--border);
  }
  .agent-list-item:last-child{ border-bottom:none; }
  .agent-list-item .meta{ flex:1; min-width:0; }
  .agent-list-item .aname{ font-weight:600; font-size:14px; }
  .agent-list-item .progress-mini{ display:flex; align-items:center; gap:8px; margin-top:6px; }
  .agent-list-item .progress-mini .bar-track{ width:90px; }
  .agent-list-item .num-badge{ font-family:'El Messiri', serif; font-weight:700; font-size:15px; min-width:44px; text-align:left; direction:ltr; }

  .empty-state{ text-align:center; padding:34px 18px; color:var(--text-dim); }
  .empty-state .icon{ font-size:30px; margin-bottom:10px; }

  @media (min-width:640px){
    .stat-grid{ grid-template-columns:repeat(4,1fr); }
  }

  /* ---------- import / lists / reasons ---------- */
  .dropzone{
    border:1.5px dashed var(--border); border-radius:12px; padding:26px 16px; text-align:center;
    cursor:pointer; color:var(--text-dim); font-size:13px; position:relative;
  }
  .dropzone.drag{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .dropzone input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .dropzone .icon{ font-size:26px; margin-bottom:6px; }
  .contact-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 4px; border-bottom:1px solid var(--border);
  }
  .contact-row:last-child{ border-bottom:none; }
  .contact-row .cmeta{ flex:1; min-width:0; }
  .contact-row .cname{ font-weight:600; font-size:14.5px; }
  .contact-row .cphone{ font-size:12.5px; color:var(--text-dim); direction:ltr; text-align:right; margin-top:2px; }
  .contact-actions{ display:flex; gap:8px; flex-shrink:0; }
  .icon-btn{
    width:40px; height:40px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text); font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn.success{ border-color:var(--activation); color:var(--activation); }
  .icon-btn.fail{ border-color:var(--danger); color:var(--danger); }
  .status-pill{ font-size:10.5px; padding:3px 9px; border-radius:20px; font-weight:600; }
  .status-pill.pending{ background:var(--surface-3); color:var(--text-dim); }
  .status-pill.success{ background:var(--activation-soft); color:var(--activation); }
  .status-pill.failed{ background:var(--danger-soft); color:#f0b3ae; }
  .reason-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:14px 0; }
  .reason-chip{
    padding:11px 10px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text); font-size:12.5px; text-align:center; cursor:pointer;
  }
  .reason-chip.selected{ border-color:var(--danger); background:var(--danger-soft); color:#f0b3ae; }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:flex-end;
    justify-content:center; z-index:200;
  }
  .modal-sheet{
    background:var(--surface); border:1px solid var(--border); border-radius:18px 18px 0 0;
    width:100%; max-width:480px; padding:22px 18px 26px; max-height:85vh; overflow-y:auto;
  }
  @media (min-width:640px){
    .modal-overlay{ align-items:center; }
    .modal-sheet{ border-radius:18px; }
  }
  .reason-bar-row{ display:flex; align-items:center; gap:10px; padding:8px 0; font-size:13px; }
  .reason-bar-row .rlabel{ width:150px; flex-shrink:0; }
  .reason-bar-row .bar-track{ flex:1; }
  .reason-bar-row .rcount{ width:28px; text-align:left; direction:ltr; font-weight:600; }
  .list-type-toggle{ display:flex; gap:8px; margin-bottom:14px; }
  .list-type-toggle .opt{
    flex:1; text-align:center; padding:10px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-2); cursor:pointer; font-size:13px;
  }
  .list-type-toggle .opt.active.activation{ background:var(--activation-soft); border-color:var(--activation); color:var(--activation); font-weight:600; }
  .list-type-toggle .opt.active.usage{ background:var(--usage-soft); border-color:var(--usage); color:var(--usage); font-weight:600; }
  .preview-table-wrap{ max-height:260px; overflow:auto; border:1px solid var(--border); border-radius:10px; margin:12px 0; }

  .ai-fab{
    position:fixed; bottom:22px; left:18px; z-index:90; width:52px; height:52px; border-radius:50%;
    background:linear-gradient(145deg, var(--accent), #9c7c17); border:none; font-size:22px; cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,0.4); display:flex; align-items:center; justify-content:center;
  }
  .ai-modal-sheet{ max-width:480px; display:flex; flex-direction:column; height:80vh; max-height:640px; }
  .ai-log{ flex:1; overflow-y:auto; padding:4px 2px; font-size:13.5px; line-height:1.8; }
  .ai-msg-user{ margin-top:10px; color:var(--accent); }
  .ai-msg-bot{ margin-top:8px; color:var(--text); }
  .ai-msg-error{ margin-top:8px; color:var(--danger); }
  .ai-inputrow{ display:flex; gap:8px; margin-top:10px; }
  .ai-inputrow input{ flex:1; }

  @media print{
    body{ background:#fff; }
    body *{ visibility:hidden; }
    .report-print, .report-print *{ visibility:visible !important; color:#111 !important; }
    .report-print{ position:absolute; left:0; top:0; width:100%; }
    .card{ background:#fff; border:1px solid #ccc; break-inside:avoid; }
    .stat-card{ background:#f5f5f5; border:1px solid #ddd; }
    table, th, td{ border-color:#ccc !important; }
    .bar-fill{ background:#999 !important; }
    .ai-fab{ display:none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
(function(){

/* ============================== STATE ============================== */
var browseSearchDebounce=null;
var waitingSearchDebounce=null;
var STATE = {
  ready:false,
  users:[],
  entries:[],
  calllists:[],
  settings:null,
  currentUserId:null,
  view:'login',        // login | setup
  adminTab:'overview',
  agentTab:'today',
  adminListType:'تفعيل',
  reportMode:'summary',   // summary | daily | individual
  reportDate:null,        // for daily report (defaults to today)
  reportAgentId:null,     // for individual report
  reportPeriodType:'month', // day | month | range (for individual report)
  reportWeekAnchor:null,   // any date within the target week
  reportRangeStart:null,
  reportRangeEnd:null,
  failedReportStart:null,
  failedReportEnd:null,
  acceptedReportStart:null,
  acceptedReportEnd:null,
  acceptedReportAgentId:null,
  failedReportAgentId:null,
  browseTableLimit:100,   // performance: cap rendered rows in the admin "all contacts" table
  browseSearchQuery:'',
  browseBatchFilter:'',
  pendingListLimit:100,   // performance: cap rendered rows in an agent's pending-contacts list
  waitingListLimit:100,   // performance: cap rendered rows in an agent's waiting-list tab
  waitingSearchQuery:'',
  calllistsLoading:false,
  aiChatLog:[],   // {role:'user'|'bot'|'error', text} — in-memory only, not saved
  importPreview:null,  // {listType, rows:[{name,phone,accountNo}]}
  modal:null,           // {type:'action', contactId, actionType} | {type:'editUser', userId}
  callStarts:{},        // contactId -> Date.now() when the in-app call button was pressed (not persisted)
  pinBuffer:'',
  loginStep:'name',    // name -> pin
  loginSelectedUser:null,
  entryDraft:{},
};

var DEFAULT_SETTINGS = {
  dailyTargetActivation:125,
  dailyTargetUsage:125,
  monthlyTargetTeamActivation:2500,
  monthlyTargetTeamUsage:2500,
  directorName:''
};

var TEAM_LABEL = { 'تفعيل':'Groupe contact client non valide', 'استخدام':'Groupe contact client inactif' };

/* Anciennes valeurs arabes (historique) — conservées pour l'affichage rétrocompatible uniquement */
var REASONS_FR = {
  'نسي كلمة السر':'Mot de passe oublié',
  'لا يملك رصيداً كافياً':'Solde insuffisant',
  'لم يفهم كيفية الاستخدام':"Ne comprend pas l'utilisation",
  'الرقم لا يرد / مغلق':'Numéro injoignable / éteint',
  'رفض / غير مهتم':'Refus / non intéressé',
  'مشكلة تقنية في التطبيق':'Problème technique',
  'رقم غير صحيح':'Numéro incorrect',
  'أخرى':'Autre'
};
function frReason(r){ return r ? (REASONS_FR[r] || r) : ''; }

/* Motifs — appel réussi (client joint) */
var SUCCESS_REASONS = [
  'Validé',
  'Déjà validé',
  'Mot de passe oublié',
  'Blocage',
  'Changement de téléphone',
  'Changement de numéro',
  "Le client n'a pas connaissance de son compte",
  'Autre'
];
/* Motifs — appel échoué (client non joint / non intéressé) */
var FAIL_REASONS = [
  'Injoignable',
  'Non intéressé',
  'En cours',
  'Autre'
];
// Motifs temporaires susceptibles de changer plus tard — éligibles au rappel après un délai
var RECOVERABLE_REASONS = ['Injoignable', 'En cours', 'نسي كلمة السر', 'لا يملك رصيداً كافياً', 'مشكلة تقنية في التطبيق', 'الرقم لا يرد / مغلق'];
var RETRY_AFTER_DAYS = 14;

/* ---- French labels used in generated reports (Excel/PDF) — operational Arabic UI stays as-is ---- */
var BANK_NAME_FR = 'البنك الموريتاني للاستثمار';
var FR_TEAM_LABEL = { 'تفعيل':'Groupe contact client non valide', 'استخدام':'Groupe contact client inactif' };
var FR_TEAM_LABEL_SHORT = { 'تفعيل':'Non valide', 'استخدام':'Inactif' };
function frRoleLabel(u){
  if(u.role==='admin') return 'Responsable de centre contact';
  if(u.role==='assistant') return 'Assistante';
  return 'Agent — ' + FR_TEAM_LABEL[u.team];
}
var RL = {
  summaryTitle: "Rapport résumé de l'équipe",
  dailyTitle: 'Rapport journalier',
  weeklyTitle: 'Rapport hebdomadaire',
  rangeTitle: 'Rapport personnalisé',
  individualTitle: 'Rapport individuel',
  period: 'Période',
  totalNonValide: 'Total — Groupe non valide',
  totalInactif: 'Total — Groupe inactif',
  totalGeneral: 'Total général',
  detailByAgent: 'Détail par agent',
  name: 'Nom', team: 'Équipe', achievement: 'Réalisations', callTime: "Temps d'appel",
  commonReasons: "Motifs d'échec les plus fréquents",
  contactDetails: 'Détails des contacts',
  agentCol: 'Agent', phone: 'Téléphone', type: 'Type', time: 'Heure', duration: 'Durée',
  status: 'Statut', reason: 'Motif', date: 'Date',
  success: 'Réussi', failed: 'Échoué', pendingStatus: 'En attente',
  manualExtra: 'Opérations manuelles supplémentaires (hors liste)', count: 'Nombre',
  signatureCenterHead: 'Signature — Responsable de centre contact',
  signatureDirector: 'Signature — Directeur SEDAD',
  printSave: 'Imprimer / Enregistrer en PDF',
  exportExcel: 'Exporter en Excel',
  noData: 'Aucune donnée pour cette période',
  manual: 'manuel', successCount:'Réussites', failedCount:'Échecs', totalHandled:'Total traité'
};

/* ============================== UTIL ============================== */
function uid(){ return 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function monthKey(dateStr){ return dateStr.slice(0,7); }
function currentMonthKey(){ return monthKey(todayStr()); }
function fmtNum(n){ return (n||0).toLocaleString('en-US'); }
function weekdayShort(dateStr){
  var days=['dim','lun','mar','mer','jeu','ven','sam'];
  var d=new Date(dateStr+'T00:00:00');
  return days[d.getDay()];
}
function el(html){ var t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h=setTimeout(function(){ t.classList.remove('show'); }, 2200);
}
function workdaysElapsedInMonth(){
  // simple business estimate: count days so far this month excluding Fridays (weekend in Mauritania)
  var now=new Date(); var count=0;
  for(var d=1; d<=now.getDate(); d++){
    var dt=new Date(now.getFullYear(), now.getMonth(), d);
    if(dt.getDay()!==5) count++;
  }
  return Math.max(count,1);
}

/* ---- Authentification anonyme : donne un jeton d'accès sans aucune inscription visible ---- */
var authState = { idToken:null, refreshToken:null, expiresAt:0, pending:null };
async function anonymousSignIn(){
  var res = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+FIREBASE_API_KEY, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({returnSecureToken:true})
  });
  if(!res.ok) throw new Error('auth signup failed: '+res.status);
  var data = await res.json();
  authState.idToken=data.idToken; authState.refreshToken=data.refreshToken;
  authState.expiresAt=Date.now()+(parseInt(data.expiresIn||'3600')*1000);
}
async function refreshAuthToken(){
  var res = await fetch('https://securetoken.googleapis.com/v1/token?key='+FIREBASE_API_KEY, {
    method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body: 'grant_type=refresh_token&refresh_token='+encodeURIComponent(authState.refreshToken)
  });
  if(!res.ok) throw new Error('auth refresh failed: '+res.status);
  var data = await res.json();
  authState.idToken=data.id_token; authState.refreshToken=data.refresh_token;
  authState.expiresAt=Date.now()+(parseInt(data.expires_in||'3600')*1000);
}
async function ensureAuth(){
  if(!authConfigured()) return null;
  if(authState.idToken && Date.now() < authState.expiresAt-60000) return authState.idToken;
  if(authState.pending) return authState.pending;
  authState.pending = (async function(){
    try{
      if(authState.refreshToken){ await refreshAuthToken(); }
      else{ await anonymousSignIn(); }
    }catch(e){
      try{
        // si le rafraîchissement échoue, retente une connexion anonyme neuve
        await anonymousSignIn();
      }catch(e2){
        // l'authentification a échoué des deux façons — on continue sans jeton plutôt
        // que de faire planter tous les chargements de données (dégradation en douceur)
        authState.idToken=null; authState.refreshToken=null; authState.expiresAt=0;
        authState.pending=null;
        return null;
      }
    }
    authState.pending=null;
    return authState.idToken;
  })();
  return authState.pending;
}
async function authQueryParam(){
  var token = await ensureAuth();
  return token ? ('?auth='+token) : '';
}

async function dbGet(key){
  var qp = await authQueryParam();
  var res = await fetch(FIREBASE_DB_URL + '/' + APP_KEY + '/' + key + '.json' + qp);
  if(!res.ok) throw new Error('fetch failed: ' + res.status);
  return await res.json();
}
async function dbSet(key, value){
  var qp = await authQueryParam();
  var res = await fetch(FIREBASE_DB_URL + '/' + APP_KEY + '/' + key + '.json' + qp, {
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(value)
  });
  if(!res.ok) throw new Error('save failed: ' + res.status);
  return true;
}
// Multi-location atomic update: only touches the specific child keys given, leaving
// everything else untouched — critical when several people (agents + admin) use the
// app at the same time, so one person's save never overwrites another's in-progress work.
async function dbPatch(key, updatesObj){
  var qp = await authQueryParam();
  var res = await fetch(FIREBASE_DB_URL + '/' + APP_KEY + '/' + key + '.json' + qp, {
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(updatesObj)
  });
  if(!res.ok) throw new Error('save failed: ' + res.status);
  return true;
}

  // sous-ensemble nécessaire (voir loadCalllistsForCurrentUser) — pour ne jamais faire

  return dedupeCalllistsRaw(rawAll);
}
async function dbQuery(key, orderByField, equalToValue){
  var qp = await authQueryParam();
  var queryPart = 'orderBy=%22'+orderByField+'%22&equalTo='+encodeURIComponent('"'+equalToValue+'"');
  var url = FIREBASE_DB_URL + '/' + APP_KEY + '/' + key + '.json' + (qp ? qp+'&'+queryPart : '?'+queryPart);
  var res = await fetch(url);
  if(!res.ok) throw new Error('query failed: ' + res.status);
  return await res.json();
}
// Turns the raw Firebase value (array OR keyed object, and possibly a mix of legacy
// numeric-indexed entries alongside newer id-keyed ones) into a clean deduplicated array —
// purely by reading, never by writing back, so many people loading at once can never race
// each other into overwriting one another's data (the bug that caused past data loss).
function dedupeCalllistsRaw(raw){
  if(!raw) return [];
  var byId={};
  Object.keys(raw).forEach(function(fbKey){
    var item=raw[fbKey];
    if(!item || !item.id) return;
    var isCanonical = (fbKey===item.id);
    if(isCanonical || !byId[item.id]) byId[item.id]=item;
  });
  return Object.keys(byId).map(function(k){ return byId[k]; });
}
// Upsert one or more contacts into the flat store AND each one's per-agent mirror
// (calllists_by_agent/{assignedTo}/{id}) — a plain path, not a Firebase "query", so an
// agent's later read is a guaranteed-reliable direct lookup instead of an orderBy/equalTo
// query (which is what silently returned nothing and caused the earlier outage).
// Pass previousAssignedToById ({id: oldAssignedTo}) when a save might have changed who a
// contact is assigned to, so the old mirror location gets cleaned up too.
async function saveCalllistItems(items, previousAssignedToById){
  var flatUpdates={};
  items.forEach(function(c){ flatUpdates[c.id]=c; });
  var promises=[ dbPatch('calllists', flatUpdates) ];

  var byAgentUpdates={};
  items.forEach(function(c){
    if(c.assignedTo){
      byAgentUpdates[c.assignedTo]=byAgentUpdates[c.assignedTo]||{};
      byAgentUpdates[c.assignedTo][c.id]=c;
    }
  });
  Object.keys(byAgentUpdates).forEach(function(agentId){
    promises.push(dbPatch('calllists_by_agent/'+agentId, byAgentUpdates[agentId]));
  });

  if(previousAssignedToById){
    var byOldAgentDeletes={};
    items.forEach(function(c){
      var oldAgent=previousAssignedToById[c.id];
      if(oldAgent && oldAgent!==c.assignedTo){
        byOldAgentDeletes[oldAgent]=byOldAgentDeletes[oldAgent]||{};
        byOldAgentDeletes[oldAgent][c.id]=null;
      }
    });
    Object.keys(byOldAgentDeletes).forEach(function(agentId){
      promises.push(dbPatch('calllists_by_agent/'+agentId, byOldAgentDeletes[agentId]));
    });
  }

  try{ await Promise.all(promises); }
  catch(e){ showToast('Échec de l\'enregistrement, vérifiez la connexion internet'); }
}
// Delete one or more contacts by id, from both the flat store and their per-agent mirror.
// Pass full {id, assignedTo} pairs (not bare ids) so the correct mirror bucket is cleaned.
async function deleteCalllistItems(items){
  var flatDeletes={};
  var byAgentDeletes={};
  items.forEach(function(it){
    flatDeletes[it.id]=null;
    if(it.assignedTo){
      byAgentDeletes[it.assignedTo]=byAgentDeletes[it.assignedTo]||{};
      byAgentDeletes[it.assignedTo][it.id]=null;
    }
  });
  var promises=[ dbPatch('calllists', flatDeletes) ];
  Object.keys(byAgentDeletes).forEach(function(agentId){
    promises.push(dbPatch('calllists_by_agent/'+agentId, byAgentDeletes[agentId]));
  });
  try{ await Promise.all(promises); }
  catch(e){ showToast('Échec de la suppression, vérifiez la connexion internet'); }
}

/* ============================== ACTUALISATION PÉRIODIQUE (légère, économe en données) ==============================
   Une ancienne version utilisait un flux permanent (SSE) pour la mise à jour en direct. Sur
   réseau mobile, ce type de connexion se coupe et se reconnecte très souvent (changement de
   cellule, mise en veille, etc.), et à CHAQUE reconnexion Firebase renvoie l'intégralité des
   données — avec plusieurs milliers de contacts, cela a consommé énormément de données mobiles.
   On revient donc à une actualisation simple par requête classique, à intervalle raisonnable,
   uniquement quand l'écran est visible — pour un usage de données prévisible et limité.
=========================================================================================================================== */
function safeLiveRender(){

  try{ STATE.entries = (await dbGet('entries')) || STATE.entries; }catch(e){}
  try{ STATE.settings = (await dbGet('settings')) || STATE.settings; }catch(e){}
  safeLiveRender();
}
function startAllLiveSync(){
  if(!firebaseConfigured()) return;
  setInterval(pollForUpdates, POLL_INTERVAL_MS);
}

/* ============================== DATA HELPERS ============================== */
function getUser(id){ return STATE.users.find(function(u){ return u.id===id; }); }
function agentsOnly(){ return STATE.users.filter(function(u){ return u.role==='agent'; }); }
function entriesFor(userId, month){
  return STATE.entries.filter(function(e){ return e.userId===userId && (!month || monthKey(e.date)===month); });
}
function todayEntry(userId){
  return STATE.entries.find(function(e){ return e.userId===userId && e.date===todayStr(); });
}
function monthTotal(userId, month){
  return entriesFor(userId, month || currentMonthKey()).reduce(function(s,e){ return s+e.count; }, 0);
}
function teamAgents(team){ return agentsOnly().filter(function(a){ return a.team===team; }); }

function listSuccessesForUserOnDate(userId, date){
  return STATE.calllists.filter(function(c){ return c.assignedTo===userId && c.status==='success' && c.actionDate===date; }).length;
}
function listSuccessesMonthForUser(userId, month){
  return STATE.calllists.filter(function(c){ return c.assignedTo===userId && c.status==='success' && c.actionDate && monthKey(c.actionDate)===month; }).length;
}
function combinedToday(userId){
  var te=todayEntry(userId);
  return (te?te.count:0) + listSuccessesForUserOnDate(userId, todayStr());
}
function combinedMonthTotal(userId, month){
  month = month || currentMonthKey();
  return monthTotal(userId, month) + listSuccessesMonthForUser(userId, month);
}
function teamMonthTotal(team, month){
  return teamAgents(team).reduce(function(s,a){ return s + combinedMonthTotal(a.id, month); }, 0);
}
function teamSuccessRateMonth(team, month){
  var contacts=[];
  teamAgents(team).forEach(function(a){ contacts=contacts.concat(contactsForAgentMonth(a.id, month)); });
  var success=contacts.filter(function(c){ return c.status==='success'; }).length;
  var failed=contacts.filter(function(c){ return c.status==='failed'; }).length;
  var total=success+failed;
  return total>0 ? Math.round((success/total)*100) : null;
}
function agentWeekRating(user){
  var monday=mondayOf(todayStr());
  var sunday=addDaysStr(monday,6);
  var target=dailyTargetFor(user);
  var weeklyTarget=target*6;
  var achieved=combinedRangeTotal(user.id, monday, sunday);
  var pctAchieved = weeklyTarget>0 ? Math.min(1, achieved/weeklyTarget) : 0;
  var contacts=contactsInRange(monday, sunday, user.id);
  var success=contacts.filter(function(c){ return c.status==='success'; }).length;
  var failed=contacts.filter(function(c){ return c.status==='failed'; }).length;
  var successRate = (success+failed)>0 ? success/(success+failed) : null;
  var scoreForRate = successRate!=null ? successRate : pctAchieved;
  var combined = (pctAchieved*0.6) + (scoreForRate*0.4);
  var stars = Math.max(1, Math.min(5, Math.round(combined*5) || 1));
  return { stars:stars, achieved:achieved, weeklyTarget:weeklyTarget, successRate:successRate };
}
function hourlySuccessStats(){
  var buckets={};
  STATE.calllists.forEach(function(c){
    if(c.status!=='success' && c.status!=='failed') return;
    if(!c.actionAt) return;
    var h=new Date(c.actionAt).getHours();
    if(!buckets[h]) buckets[h]={success:0, failed:0};
    if(c.status==='success') buckets[h].success++; else buckets[h].failed++;
  });
  var arr=Object.keys(buckets).map(function(h){
    var b=buckets[h]; var total=b.success+b.failed;
    return {hour:parseInt(h), total:total, rate: total>0?Math.round((b.success/total)*100):0};
  }).filter(function(x){ return x.total>=3; });
  arr.sort(function(a,b){ return b.rate-a.rate; });
  return arr;
}
function teamTodayTotal(team){
  return teamAgents(team).reduce(function(s,a){ return s + combinedToday(a.id); }, 0);
}
function pendingContactsFor(userId){
  return STATE.calllists.filter(function(c){ return c.assignedTo===userId && c.status==='pending' && !c.archived; });
}
// "Liste d'attente" — an agent's own rejected calls, limited to the two recoverable reasons
var WAITING_LIST_REASONS = ['Injoignable', 'En cours'];
function waitingListFor(userId){
  return STATE.calllists.filter(function(c){
    return c.assignedTo===userId && c.status==='failed' && !c.archived && WAITING_LIST_REASONS.indexOf(c.reason)!==-1;
  });
}
function doneContactsForToday(userId){
  return STATE.calllists.filter(function(c){ return c.assignedTo===userId && c.status!=='pending' && c.actionDate===todayStr(); });
}
function reasonCounts(month, listType){
  var map={};
  STATE.calllists.forEach(function(c){
    if(c.status!=='failed') return;
    if(!c.actionDate || monthKey(c.actionDate)!==month) return;
    if(listType && c.listType!==listType) return;
    map[c.reason] = (map[c.reason]||0) + 1;
  });
  return map;
}
function contactsOnDate(date, agentId){
  return STATE.calllists.filter(function(c){
    if(c.status==='pending') return false;
    if(c.actionDate!==date) return false;
    if(agentId && c.assignedTo!==agentId) return false;
    return true;
  });
}
function contactsForAgentMonth(agentId, month){
  return STATE.calllists.filter(function(c){
    return c.assignedTo===agentId && c.status!=='pending' && c.actionDate && monthKey(c.actionDate)===month;
  });
}
function daysSince(dateStr){
  var then=new Date(dateStr+'T00:00:00');
  var now=new Date(todayStr()+'T00:00:00');
  return Math.round((now-then)/86400000);
}
function retryEligibleContacts(listType){
  return STATE.calllists.filter(function(c){
    if(c.archived) return false;
    if(c.status!=='failed') return false;
    if(RECOVERABLE_REASONS.indexOf(c.reason)===-1) return false;
    if(!c.actionDate || daysSince(c.actionDate)<RETRY_AFTER_DAYS) return false;
    if(listType && c.listType!==listType) return false;
    return true;
  });
}
function contactsInRange(startDate, endDate, agentId){
  return STATE.calllists.filter(function(c){
    if(c.status==='pending') return false;
    if(!c.actionDate) return false;
    if(c.actionDate<startDate || c.actionDate>endDate) return false;
    if(agentId && c.assignedTo!==agentId) return false;
    return true;
  });
}
function manualEntriesInRange(startDate, endDate, agentId){
  return STATE.entries.filter(function(e){
    if(e.date<startDate || e.date>endDate) return false;
    if(agentId && e.userId!==agentId) return false;
    return e.count>0;
  });
}
function combinedRangeTotal(agentId, startDate, endDate){
  var listCount=contactsInRange(startDate,endDate,agentId).filter(function(c){ return c.status==='success'; }).length;
  var manual=manualEntriesInRange(startDate,endDate,agentId).reduce(function(s,e){ return s+e.count; },0);
  return listCount+manual;
}
function teamRangeTotal(team, startDate, endDate){
  return teamAgents(team).reduce(function(s,a){ return s+combinedRangeTotal(a.id,startDate,endDate); },0);
}
function callSecondsInRange(agentId, startDate, endDate){
  return STATE.calllists.filter(function(c){ return c.assignedTo===agentId && c.actionDate && c.actionDate>=startDate && c.actionDate<=endDate && c.callDurationSeconds; })
    .reduce(function(s,c){ return s+(c.callDurationSeconds||0); }, 0);
}
function reasonCountsInRange(startDate, endDate){
  var map={};
  STATE.calllists.forEach(function(c){
    if(c.status!=='failed') return;
    if(!c.actionDate || c.actionDate<startDate || c.actionDate>endDate) return;
    map[c.reason]=(map[c.reason]||0)+1;
  });
  return map;
}
function mondayOf(dateStr){
  var d=new Date(dateStr+'T00:00:00');
  var day=d.getDay(); // 0=Sun..6=Sat
  var diff = day===0 ? -6 : (1-day); // move back to Monday
  d.setDate(d.getDate()+diff);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDaysStr(dateStr, n){
  var d=new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function exportAoaToExcel(filename, sheetName, aoa){

function fmtTime(iso){
  var d=new Date(iso);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}
function fmtDuration(totalSeconds){
  totalSeconds = totalSeconds||0;
  var h=Math.floor(totalSeconds/3600);
  var m=Math.floor((totalSeconds%3600)/60);
  var s=totalSeconds%60;
  if(h>0) return h+'س '+m+'د '+s+'ث';
  if(m>0) return m+'د '+s+'ث';
  return s+'ث';
}
function agentCallSecondsOnDate(agentId, date){
  return STATE.calllists.filter(function(c){ return c.assignedTo===agentId && c.actionDate===date && c.callDurationSeconds; })
    .reduce(function(s,c){ return s+(c.callDurationSeconds||0); }, 0);
}
function agentCallSecondsInMonth(agentId, month){
  return STATE.calllists.filter(function(c){ return c.assignedTo===agentId && c.actionDate && monthKey(c.actionDate)===month && c.callDurationSeconds; })
    .reduce(function(s,c){ return s+(c.callDurationSeconds||0); }, 0);
}
var SUSPICIOUS_GAP_SECONDS = 15;
function suspiciousGapCount(agentId, date){
  var acts = STATE.calllists.filter(function(c){ return c.assignedTo===agentId && c.actionDate===date && c.actionAt; })
    .sort(function(a,b){ return new Date(a.actionAt)-new Date(b.actionAt); });
  var count=0;
  for(var i=1;i<acts.length;i++){
    var gap=(new Date(acts[i].actionAt)-new Date(acts[i-1].actionAt))/1000;
    if(gap<SUSPICIOUS_GAP_SECONDS) count++;
  }
  return count;
}
function dailyTargetFor(user){
  if(user.dailyTarget) return user.dailyTarget;
  return user.team==='تفعيل' ? STATE.settings.dailyTargetActivation : STATE.settings.dailyTargetUsage;
}
function last7Days(userId){
  var out=[];
  for(var i=6;i>=0;i--){
    var d=new Date(); d.setDate(d.getDate()-i);
    var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    var ent=STATE.entries.find(function(e){ return e.userId===userId && e.date===ds; });
    out.push({date:ds, count:ent?ent.count:0});
  }
  return out;
}

/* ============================== RENDER ROOT ============================== */
function render(){
  var app=document.getElementById('app');
  app.innerHTML='';
  if(STATE.ready==='unconfigured'){
    app.appendChild(el(
      '<div class="login-wrap"><div class="stamp-card" style="max-width:440px; text-align:right;">'+
      '<div class="login-title" style="text-align:center;">⚙️ Configuration requise</div>'+
      '<div class="login-sub" style="text-align:center;">L\'application n\'est pas encore connectée à une base de données</div>'+
      '<div class="faint" style="line-height:1.9; font-size:13px;">'+
      'Ouvrez le fichier <b style="color:var(--text)">index.html</b> sur GitHub, cliquez sur l\'icône crayon pour modifier, '+
      'et cherchez la ligne :<br><code style="color:var(--accent);">var FIREBASE_DB_URL = "REPLACE-ME";</code><br>'+
      'Remplacez REPLACE-ME par l\'URL de votre base Firebase, puis enregistrez (Commit changes).'+
      '</div></div></div>'
    ));
    return;
  }
  if(!STATE.ready){
    app.appendChild(el('<div class="login-wrap"><div class="muted">Chargement…</div></div>'));
    return;
  }
  if(STATE.loadError){
    app.appendChild(el(
      '<div class="login-wrap"><div class="stamp-card" style="max-width:400px; text-align:center;">'+
      '<div class="login-title">Connexion à la base de données impossible</div>'+
      '<div class="faint" style="margin-top:8px;">Vérifiez l\'URL FIREBASE_DB_URL et les règles d\'accès (Rules) dans Firebase, puis rechargez la page</div>'+
      '</div></div>'
    ));
    return;
  }
  if(!STATE.currentUserId){
    if(STATE.users.length===0){ app.appendChild(renderSetup()); }
    else{ app.appendChild(renderLogin()); }
    return;
  }
  var user=getUser(STATE.currentUserId);
  if(!user){ STATE.currentUserId=null; render(); return; }
  if(STATE.calllistsLoading){
    app.appendChild(el('<div class="login-wrap"><div class="muted">Chargement de vos données…</div></div>'));
    return;
  }

  var wrap=document.createElement('div');
  wrap.appendChild(renderTopbar(user));
  var main=document.createElement('main');
  if(user.role==='agent'){ main.appendChild(renderAgentView(user)); }
  else{ main.appendChild(renderAdminView(user)); }
  wrap.appendChild(main);
  app.appendChild(wrap);

  if(geminiConfigured()){
    var aiFab=el('<button class="ai-fab" title="Assistant">🤖</button>');
    aiFab.onclick=function(){ STATE.modal={type:'ai'}; render(); };
    app.appendChild(aiFab);
  }

  if(STATE.modal && STATE.modal.type==='action'){
    app.appendChild(renderActionModal(STATE.modal.contactId, STATE.modal.actionType));
  }
  if(STATE.modal && STATE.modal.type==='editUser'){
    app.appendChild(renderEditUserModal(STATE.modal.userId));
  }
  if(STATE.modal && STATE.modal.type==='ai'){
    app.appendChild(renderAiModal(user));
  }
}

/* ============================== ACTION MODAL (success/fail + timestamp + call duration) ============================== */
function renderActionModal(contactId, actionType){
  var c = STATE.calllists.find(function(x){ return x.id===contactId; });
  var overlay=el('<div class="modal-overlay"></div>');
  overlay.onclick=function(e){ if(e.target===overlay){ STATE.modal=null; render(); } };
  var sheet=el('<div class="modal-sheet"></div>');
  var title = actionType==='success' ? 'Confirmer la réussite' : 'Motif de l\'échec';
  sheet.appendChild(el('<div class="login-title" style="text-align:right; font-size:16px;">'+title+'</div>'));
  sheet.appendChild(el('<div class="faint" style="margin-bottom:10px;">'+(c?escapeHtml(c.name||''):'')+'</div>'));

  var selected = {reason:null, custom:''};
  var reasonList = actionType==='success' ? SUCCESS_REASONS : FAIL_REASONS;
  var grid=el('<div class="reason-grid"></div>');
  reasonList.forEach(function(r){
    var chip=el('<div class="reason-chip">'+r+'</div>');
    chip.onclick=function(){
      selected.reason=r;
      grid.querySelectorAll('.reason-chip').forEach(function(x){ x.classList.remove('selected'); });
      chip.classList.add('selected');
      customBox.style.display = (r==='Autre') ? 'block' : 'none';
    };
    grid.appendChild(chip);
  });
  sheet.appendChild(grid);
  var customBox=el('<div class="field" style="display:none;"><label>Précisez le motif</label></div>');
  var customInput=document.createElement('input');
  customInput.placeholder='Écrivez le motif ici...';
  customInput.oninput=function(){ selected.custom=customInput.value; };
  customBox.appendChild(customInput);
  sheet.appendChild(customBox);

  var callStart = STATE.callStarts[contactId];
  var autoSeconds = callStart ? Math.round((Date.now()-callStart)/1000) : null;

  sheet.appendChild(el('<div class="section-title" style="margin-top:14px;">Durée de l\'appel</div>'));
  var minInput, secInput;
  if(autoSeconds!==null){
    sheet.appendChild(el(
      '<div class="card" style="background:var(--activation-soft); border-color:var(--activation); padding:12px;">'+
      '<div style="font-family:\'El Messiri\',serif; font-size:20px; font-weight:700; color:var(--activation);">'+fmtDurationFr(autoSeconds)+'</div>'+
      '<div class="faint" style="font-size:11px; margin-top:2px;">Mesurée automatiquement depuis l\'appui sur le bouton d\'appel 📞 — non modifiable</div>'+
      '</div>'
    ));
  } else {
    sheet.appendChild(el(
      '<div class="faint" style="font-size:11.5px; margin-bottom:8px;">Vous n\'avez pas appuyé sur le bouton d\'appel 📞 — saisissez la durée manuellement (sera marqué pour vérification)</div>'
    ));
    var durRow=el('<div class="row"></div>');
    minInput=document.createElement('input'); minInput.type='number'; minInput.min='0'; minInput.placeholder='minutes'; minInput.value='0';
    secInput=document.createElement('input'); secInput.type='number'; secInput.min='0'; secInput.max='59'; secInput.placeholder='secondes'; secInput.value='0';
    var f1=el('<div class="field" style="flex:1;"><label>Minutes</label></div>'); f1.appendChild(minInput);
    var f2=el('<div class="field" style="flex:1;"><label>Secondes</label></div>'); f2.appendChild(secInput);
    durRow.appendChild(f1); durRow.appendChild(f2);
    sheet.appendChild(durRow);
  }

  var confirmBtn=el('<button class="btn block" style="margin-top:6px;">Confirmer</button>');
  confirmBtn.onclick=async function(){
    if(!selected.reason){ showToast('Choisissez un motif d\'abord'); return; }
    var durationSeconds, autoTimed;
    if(autoSeconds!==null){
      durationSeconds=autoSeconds; autoTimed=true;
    } else {
      var mins=Math.max(0, parseInt(minInput.value)||0);
      var secs=Math.max(0, Math.min(59, parseInt(secInput.value)||0));
      durationSeconds=mins*60+secs; autoTimed=false;
    }
    var finalReason = selected.reason==='Autre' && selected.custom.trim() ? selected.custom.trim() : selected.reason;
    if(c){
      c.status = actionType==='success' ? 'success' : 'failed';
      c.actionDate = todayStr();
      c.actionAt = new Date().toISOString();
      c.callDurationSeconds = durationSeconds;
      c.autoTimed = autoTimed;
      c.reason = finalReason;
    }
    delete STATE.callStarts[contactId];
    if(c){ await saveCalllistItems([c]); }
    STATE.modal=null;
    showToast('Enregistré');
    render();
  };
  sheet.appendChild(confirmBtn);
  var cancelBtn=el('<button class="btn ghost block" style="margin-top:8px;">Annuler</button>');
  cancelBtn.onclick=function(){ STATE.modal=null; render(); };
  sheet.appendChild(cancelBtn);

  overlay.appendChild(sheet);
  return overlay;
}

/* ============================== EDIT USER MODAL ============================== */
function renderEditUserModal(userId){
  var u = getUser(userId);
  var overlay=el('<div class="modal-overlay"></div>');
  overlay.onclick=function(e){ if(e.target===overlay){ STATE.modal=null; render(); } };
  var sheet=el('<div class="modal-sheet"></div>');
  if(!u){ sheet.appendChild(el('<div class="faint">Ce membre n\'existe plus</div>')); overlay.appendChild(sheet); return overlay; }

  sheet.appendChild(el('<div class="login-title" style="text-align:right; font-size:16px;">Modifier les informations du membre</div>'));
  sheet.appendChild(el('<div class="faint" style="margin-bottom:10px;">'+roleLabel(u)+'</div>'));

  var nameField=el('<div class="field"><label>Nom</label></div>');
  var nameInput=document.createElement('input'); nameInput.value=u.name;
  nameField.appendChild(nameInput);
  sheet.appendChild(nameField);

  var teamSelect=null;
  if(u.role==='agent'){
    var teamField=el('<div class="field"><label>Équipe</label></div>');
    teamSelect=document.createElement('select');
    teamSelect.innerHTML='<option value="تفعيل">Groupe contact client non valide</option><option value="استخدام">Groupe contact client inactif</option>';
    teamSelect.value=u.team;
    teamField.appendChild(teamSelect);
    sheet.appendChild(teamField);
  }

  var pinField=el('<div class="field"><label>Nouveau code PIN (laisser vide pour ne pas changer)</label></div>');
  var pinInput=document.createElement('input'); pinInput.placeholder='••••'; pinInput.maxLength=4; pinInput.inputMode='numeric';
  pinField.appendChild(pinInput);
  sheet.appendChild(pinField);

  var errBox=el('<div></div>'); sheet.appendChild(errBox);

  var saveBtn=el('<button class="btn block">Enregistrer les modifications</button>');
  saveBtn.onclick=async function(){
    var newName=nameInput.value.trim();
    var newPin=pinInput.value.trim();
    errBox.innerHTML='';
    if(!newName){ errBox.appendChild(el('<div class="error-msg">Le nom est requis</div>')); return; }
    if(newPin && !/^\d{4}$/.test(newPin)){ errBox.appendChild(el('<div class="error-msg">Le code PIN doit comporter 4 chiffres</div>')); return; }
    u.name=newName;
    if(teamSelect) u.team=teamSelect.value;
    if(newPin) u.pin=newPin;
    await saveUsers();
    STATE.modal=null;
    showToast('Modifications enregistrées ✓');
    render();
  };
  sheet.appendChild(saveBtn);
  var cancelBtn=el('<button class="btn ghost block" style="margin-top:8px;">Annuler</button>');
  cancelBtn.onclick=function(){ STATE.modal=null; render(); };
  sheet.appendChild(cancelBtn);

  overlay.appendChild(sheet);
  return overlay;
}

function buildAiContext(user){
  var ctx = "Tu es l'assistant intégré à « Registre SEDAD », l'application de suivi d'une équipe de centre d'appel pour le BANQUE MAURITANIENNE POUR L'INVESTISSEMENT (application SEDAD). ";
  ctx += "Réponds TOUJOURS en arabe uniquement, de façon brève, claire et professionnelle. ";
  ctx += "Fonctionnement de l'app : les agents appellent des clients pour activer des comptes SEDAD (« Groupe contact client non valide ») ou encourager l'utilisation de comptes déjà activés (« Groupe contact client inactif »). ";
  ctx += "Onglets d'un agent : « Aujourd'hui » (objectif du jour), « Ma liste » (contacts à traiter — bouton 📞 pour chronométrer l'appel puis ✓ succès ou ✕ échec avec motif), « Liste d'attente » (appels à rappeler, motifs Injoignable/En cours). ";
  ctx += "Onglets d'un responsable : « Vue d'ensemble », « Listes » (import Excel, répartition, archivage), « Équipe », « Rapports » (résumé, journalier, hebdomadaire, période, individuel, appels acceptés/échoués — avec export Excel et impression PDF), « Paramètres ». ";
  ctx += "Ne donne jamais d'information sur un autre utilisateur que celui qui te parle, sauf si c'est le responsable de centre contact qui demande des chiffres globaux d'équipe. ";
  ctx += "\n\nContexte de la personne qui te parle maintenant :\n";
  ctx += "- Nom : " + user.name + ", rôle : " + frRoleLabel(user) + "\n";
  if(user.role==='agent'){
    var target = dailyTargetFor(user);
    var today = combinedToday(user.id);
    var monthTotalVal = combinedMonthTotal(user.id);
    ctx += "- Équipe : " + TEAM_LABEL[user.team] + "\n";
    ctx += "- Aujourd'hui : " + today + " sur " + target + " (objectif quotidien)\n";
    ctx += "- Total ce mois-ci : " + monthTotalVal + "\n";
    ctx += "- Contacts en attente (Ma liste) : " + pendingContactsFor(user.id).length + "\n";
    ctx += "- Liste d'attente (appels à rappeler) : " + waitingListFor(user.id).length + "\n";
  } else {
    var month = currentMonthKey();
    ctx += "- Total équipe ce mois — Groupe non valide : " + teamMonthTotal('تفعيل', month) + " / objectif " + STATE.settings.monthlyTargetTeamActivation + "\n";
    ctx += "- Total équipe ce mois — Groupe inactif : " + teamMonthTotal('استخدام', month) + " / objectif " + STATE.settings.monthlyTargetTeamUsage + "\n";
    ctx += "- Nombre d'agents : " + agentsOnly().length + "\n";
  }
  return ctx;
}
async function sendAiMessage(user, question, logEl, inputEl, sendBtn){
  if(!question.trim()) return;
  STATE.aiChatLog.push({role:'user', text:question});
  inputEl.value='';
  sendBtn.disabled=true;
  renderAiLog(logEl);
  var thinking = el('<div class="ai-msg-bot faint">...جارٍ الكتابة</div>');
  logEl.appendChild(thinking);
  logEl.scrollTop = logEl.scrollHeight;
  try{
    var res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'x-goog-api-key':GEMINI_API_KEY},
      body: JSON.stringify({
        systemInstruction: { parts:[{ text: buildAiContext(user) }] },
        contents: [{ parts:[{ text: question }] }]
      })
    });
    var data = await res.json();
    var answer = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0].text) || null;
    if(answer){ STATE.aiChatLog.push({role:'bot', text:answer}); }
    else if(data.error){ STATE.aiChatLog.push({role:'error', text:'خطأ من Gemini: '+(data.error.message||JSON.stringify(data.error))}); }
    else{ STATE.aiChatLog.push({role:'error', text:'رد غير متوقع من المساعد: '+JSON.stringify(data).slice(0,200)}); }
  }catch(e){
    STATE.aiChatLog.push({role:'error', text:'تعذر الاتصال بالمساعد. تحقق من الاتصال بالإنترنت.'});
  }
  sendBtn.disabled=false;
  renderAiLog(logEl);
}
function renderAiLog(logEl){
  logEl.innerHTML='';
  if(STATE.aiChatLog.length===0){
    logEl.appendChild(el('<div class="faint">مرحباً 👋 اسألني أي شيء عن استخدام التطبيق أو عن أرقامك الحالية.</div>'));
  }
  STATE.aiChatLog.forEach(function(m){
    var cls = m.role==='user' ? 'ai-msg-user' : (m.role==='error' ? 'ai-msg-error' : 'ai-msg-bot');
    var label = m.role==='user' ? 'أنت' : (m.role==='error' ? '⚠' : 'المساعد');
    logEl.appendChild(el('<div class="'+cls+'"><b>'+label+':</b> '+escapeHtml(m.text).replace(/\n/g,'<br>')+'</div>'));
  });
  logEl.scrollTop = logEl.scrollHeight;
}
function renderAiModal(user){
  var overlay=el('<div class="modal-overlay"></div>');
  overlay.onclick=function(e){ if(e.target===overlay){ STATE.modal=null; render(); } };
  var sheet=el('<div class="modal-sheet ai-modal-sheet"></div>');
  sheet.appendChild(el('<div class="login-title" style="text-align:right; font-size:16px;">🤖 المساعد</div>'));
  var logEl=el('<div class="ai-log"></div>');
  sheet.appendChild(logEl);
  renderAiLog(logEl);

  var row=el('<div class="ai-inputrow"></div>');
  var input=document.createElement('input');
  input.type='text'; input.placeholder='اكتب سؤالك...';
  var sendBtn=el('<button class="btn">إرسال</button>');
  sendBtn.onclick=function(){ sendAiMessage(user, input.value, logEl, input, sendBtn); };
  input.onkeydown=function(e){ if(e.key==='Enter'){ sendAiMessage(user, input.value, logEl, input, sendBtn); } };
  row.appendChild(input); row.appendChild(sendBtn);
  sheet.appendChild(row);

  var closeBtn=el('<button class="btn ghost block" style="margin-top:10px;">إغلاق</button>');
  closeBtn.onclick=function(){ STATE.modal=null; render(); };
  sheet.appendChild(closeBtn);

  overlay.appendChild(sheet);
  return overlay;
}

function roleLabel(u){

}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ============================== SETUP (first run) ============================== */
function renderSetup(){
  var wrap=el('<div class="login-wrap"><div class="stamp-card" style="max-width:420px;"></div></div>');
  var card=wrap.querySelector('.stamp-card');
  card.appendChild(el(
    '<div class="login-title">Configuration initiale</div>'+
    '<div class="login-sub">Créez d\'abord le compte du responsable de centre contact, puis ajoutez l\'équipe</div>'
  ));
  var form=el('<div></div>');
  form.appendChild(el('<div class="field"><label>Nom complet</label><input id="su-name" placeholder="Ex: Ahmed"/></div>'));
  form.appendChild(el('<div class="field"><label>Code PIN à 4 chiffres</label><input id="su-pin" inputmode="numeric" maxlength="4" placeholder="••••"/></div>'));
  var errBox=el('<div></div>');
  form.appendChild(errBox);
  var btn=el('<button class="btn block">Créer le compte et continuer</button>');
  btn.onclick=async function(){
    var name=document.getElementById('su-name').value.trim();
    var pin=document.getElementById('su-pin').value.trim();
    errBox.innerHTML='';
    if(!name || !/^\d{4}$/.test(pin)){
      errBox.appendChild(el('<div class="error-msg">Veuillez saisir le nom et un code à 4 chiffres</div>'));
      return;
    }
    var admin={ id:uid(), name:name, role:'admin', team:null, pin:pin, dailyTarget:null };
    STATE.users.push(admin);
    await saveUsers();
    STATE.currentUserId=admin.id;
    STATE.calllistsLoading=true;
    render();
    loadCalllistsForCurrentUser();
  };
  form.appendChild(btn);
  card.appendChild(form);
  return wrap;
}

/* ============================== LOGIN ============================== */
function renderLogin(){
  var wrap=el('<div class="login-wrap"><div class="stamp-card"></div></div>');
  var card=wrap.querySelector('.stamp-card');
  card.appendChild(el(stampRingSvg(0,'#C9A227')));
  card.appendChild(el('<div class="login-title">Connexion</div><div class="login-sub">Registre SEDAD — Gestion SEDAD</div>'));

  if(STATE.loginStep==='name'){
    var sel=el('<div></div>');
    sel.appendChild(el('<label>Choisissez votre nom</label>'));
    var selectEl=document.createElement('select');
    selectEl.appendChild(el('<option value="">-- Choisir --</option>'));
    STATE.users.slice().sort(function(a,b){ return a.name.localeCompare(b.name,'ar'); }).forEach(function(u){
      var opt=document.createElement('option');
      opt.value=u.id; opt.textContent=u.name+' ('+roleLabel(u)+')';
      selectEl.appendChild(opt);
    });
    sel.appendChild(selectEl);
    card.appendChild(sel);
    var nextBtn=el('<button class="btn block" style="margin-top:16px;">Continuer</button>');
    nextBtn.onclick=function(){
      if(!selectEl.value){ showToast('Choisissez votre nom d\'abord'); return; }
      STATE.loginSelectedUser=selectEl.value;
      STATE.loginStep='pin';
      STATE.pinBuffer='';
      render();
    };
    card.appendChild(nextBtn);
  } else {
    var u=getUser(STATE.loginSelectedUser);
    card.appendChild(el('<div style="text-align:center; font-weight:600; margin-bottom:8px;">'+escapeHtml(u.name)+'</div>'));
    card.appendChild(el('<div class="login-sub">Entrez votre code PIN</div>'));
    var dots=el('<div class="pin-dots">'+[0,1,2,3].map(function(i){ return '<span class="'+(i<STATE.pinBuffer.length?'filled':'')+'"></span>'; }).join('')+'</div>');
    card.appendChild(dots);
    var errBox=el('<div id="login-err"></div>');
    card.appendChild(errBox);
    var pad=el('<div class="keypad"></div>');
    ['1','2','3','4','5','6','7','8','9','back','0','ok'].forEach(function(k){
      var b=document.createElement('button');
      if(k==='back'){ b.textContent='⌫'; b.className='wide'; }
      else if(k==='ok'){ b.textContent='Entrer'; b.className='wide'; }
      else b.textContent=k;
      b.onclick=function(){ handleKeypad(k); };
      pad.appendChild(b);
    });
    card.appendChild(pad);
    var backLink=el('<button class="btn ghost block" style="margin-top:14px;">Retour</button>');
    backLink.onclick=function(){ STATE.loginStep='name'; STATE.loginSelectedUser=null; STATE.pinBuffer=''; render(); };
    card.appendChild(backLink);
  }
  return wrap;
}
function handleKeypad(k){
  if(k==='back'){ STATE.pinBuffer=STATE.pinBuffer.slice(0,-1); render(); return; }
  if(k==='ok'){ attemptLogin(); return; }
  if(STATE.pinBuffer.length<4){ STATE.pinBuffer+=k; }
  if(STATE.pinBuffer.length===4){ render(); attemptLogin(); return; }
  render();
}
function attemptLogin(){
  var u=getUser(STATE.loginSelectedUser);
  if(!u) return;
  if(STATE.pinBuffer===u.pin){
    STATE.currentUserId=u.id;
    STATE.pinBuffer=''; STATE.loginStep='name'; STATE.loginSelectedUser=null;
    STATE.calllistsLoading=true;
    render();
    loadCalllistsForCurrentUser();
  } else {
    var box=document.getElementById('login-err');
    if(box) box.innerHTML='<div class="error-msg">Code incorrect, réessayez</div>';
    STATE.pinBuffer='';
    setTimeout(render, 350);
  }
}

/* ============================== STAMP SVG ============================== */
function stampRingSvg(pct, color, size, label, sublabel){
  size = size || 78;
  pct = Math.max(0, Math.min(100, pct));
  var r = (size/2) - 6;
  var c = 2*Math.PI*r;
  var offset = c - (pct/100)*c;
  var cx=size/2, cy=size/2;
  return '<div class="stamp-ring" style="width:'+size+'px;height:'+size+'px;">'+
    '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#2A3D35" stroke-width="5"/>'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="5" '+
        'stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+offset+'" '+
        'transform="rotate(-90 '+cx+' '+cy+')" style="transition:stroke-dashoffset .5s ease;"/>'+
      (size>=140 ? '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r-10)+'" fill="none" stroke="#2A3D35" stroke-width="1" stroke-dasharray="2 4"/>' : '')+
    '</svg>'+
    (label!==undefined ? '<div class="ring-center"><div class="val">'+label+'</div>'+(sublabel?'<div class="of">'+sublabel+'</div>':'')+'</div>' : '')+
  '</div>';
}

/* ============================== AGENT VIEW ============================== */
function renderAgentView(user){
  var wrap=el('<div></div>');
  wrap.appendChild(el('<div class="tag '+(user.team==='تفعيل'?'activation':'usage')+'" style="margin-bottom:14px;">'+TEAM_LABEL[user.team]+'</div>'));

  var pendingCount=pendingContactsFor(user.id).length;
  var waitingCount=waitingListFor(user.id).length;
  var tabs=el('<div class="tabs"></div>');
  var t1=el('<div class="tab '+(STATE.agentTab==='today'?'active':'')+'">Aujourd\'hui</div>');
  t1.onclick=function(){ STATE.agentTab='today'; render(); };
  var t2=el('<div class="tab '+(STATE.agentTab==='list'?'active':'')+'">Ma liste'+(pendingCount?' ('+pendingCount+')':'')+'</div>');
  t2.onclick=function(){ STATE.agentTab='list'; render(); };
  var t3=el('<div class="tab '+(STATE.agentTab==='waiting'?'active':'')+'">Liste d\'attente'+(waitingCount?' ('+waitingCount+')':'')+'</div>');
  t3.onclick=function(){ STATE.agentTab='waiting'; render(); };
  tabs.appendChild(t1); tabs.appendChild(t2); tabs.appendChild(t3);
  wrap.appendChild(tabs);

  if(STATE.agentTab==='list'){ wrap.appendChild(renderAgentListTab(user)); return wrap; }
  if(STATE.agentTab==='waiting'){ wrap.appendChild(renderAgentWaitingTab(user)); return wrap; }

  var target=dailyTargetFor(user);
  var todayCount=combinedToday(user.id);
  var pct = target>0 ? Math.round((todayCount/target)*100) : 0;
  var ringColor = user.team==='تفعيل' ? '#6FBF8B' : '#E0B23A';

  var starsStr = '★'.repeat(rating.stars) + '☆'.repeat(5-rating.stars);
  var ratingCard=el(
    '<div class="card" style="margin-top:14px; text-align:center; padding:16px;">'+

    '<div style="font-size:26px; color:var(--accent); letter-spacing:2px;">'+starsStr+'</div>'+
    '<div class="faint" style="font-size:11px; margin-top:6px;">'+fmtNum(rating.achieved)+' sur '+fmtNum(rating.weeklyTarget)+' cette semaine'+

    '</div>'
  );
  wrap.appendChild(ratingCard);

  // monthly stat row
  var mTotal=combinedMonthTotal(user.id);
  var mSuccess=listSuccessesMonthForUser(user.id, currentMonthKey());
  var statGrid=el('<div class="stat-grid" style="margin-top:16px;"></div>');
  statGrid.appendChild(el('<div class="stat-card"><div class="num">'+fmtNum(mTotal)+'</div><div class="lbl">Total ce mois-ci</div></div>'));
  statGrid.appendChild(el('<div class="stat-card"><div class="num">'+fmtNum(mSuccess)+'</div><div class="lbl">Réussites de la liste ce mois-ci</div></div>'));
  wrap.appendChild(statGrid);

  last7Days(user.id).forEach(function(d){

    row.appendChild(el('<div class="d">'+weekdayShort(d.date)+'</div>'));
    row.appendChild(el('<div class="bar-track"><div class="bar-fill" style="width:'+p+'%; background:'+ringColor+';"></div></div>'));
    row.appendChild(el('<div class="v">'+fmtNum(total)+'</div>'));

    searchInput.oninput=function(){
      var v=searchInput.value;

      waitingSearchDebounce=setTimeout(function(){

        var el2=document.getElementById('waiting-search-input');
        if(el2){ el2.focus(); try{ el2.setSelectionRange(pos,pos); }catch(e){} }

    return (c.name||'').toLowerCase().indexOf(q)!==-1 || (c.phone||'').toLowerCase().indexOf(q)!==-1;
  }) : waiting;

    card.appendChild(el('<div class="empty-state"><div class="icon">✅</div><div>Aucun contact en liste d\'attente actuellement</div></div>'));

    card.appendChild(el('<div class="faint">Aucun résultat pour cette recherche</div>'));

      card.appendChild(contactRow(c));
    });

      var moreBtn=el('<button class="btn secondary block" style="margin-top:10px;">Afficher plus ('+(filtered.length-limit)+' restants)</button>');

  return wrap;

function contactRow(c, readOnly){
  var row=el('<div class="contact-row"></div>');
  var meta=el('<div class="cmeta"></div>');
  meta.appendChild(el('<div class="cname">'+escapeHtml(c.name||'Sans nom')+'</div>'));
  if(c.phone) meta.appendChild(el('<div class="cphone">'+escapeHtml(c.phone)+'</div>'));
  if(!readOnly && c.lastAttempt && c.lastAttempt.actionDate){
    meta.appendChild(el(
      '<div class="faint" style="font-size:11px; margin-top:3px; color:var(--accent);">↻ Dernière tentative il y a '+daysSince(c.lastAttempt.actionDate)+' jours — '+escapeHtml(frReason(c.lastAttempt.reason)||c.lastAttempt.reason||'')+'</div>'
    ));
  }
  if(readOnly){
    var pillClass = c.status==='success' ? 'success' : 'failed';
    var pillLabel = c.status==='success' ? ('Réussi — '+(c.reason||'')) : ('Échec — '+(frReason(c.reason)||''));
    var extra = (c.actionAt?fmtTime(c.actionAt):'') + (c.callDurationSeconds!=null?(' — durée: '+fmtDurationFr(c.callDurationSeconds)):'') + (c.autoTimed===false?' ⚠ manuel':'');
    meta.appendChild(el('<div style="margin-top:5px;"><span class="status-pill '+pillClass+'">'+escapeHtml(pillLabel)+'</span></div>'));
    if(extra.trim()) meta.appendChild(el('<div class="faint" style="font-size:11px; margin-top:3px;">'+escapeHtml(extra)+'</div>'));
  }
  row.appendChild(meta);
  if(!readOnly){
    var actions=el('<div class="contact-actions"></div>');
    var started = !!STATE.callStarts[c.id];
    var callBtn=el('<button class="icon-btn" style="border-color:var(--accent); color:var(--accent);'+(started?' background:var(--accent-soft);':'')+'">'+(started?'⏱':'📞')+'</button>');
    callBtn.onclick=function(){
      if(!c.phone){ showToast('Aucun numéro de téléphone enregistré pour ce contact'); return; }
      STATE.callStarts[c.id]=Date.now();
      showToast('Chronométrage démarré — appuyez sur ✓ ou ✕ après l\'appel');
      window.location.href='tel:'+String(c.phone).replace(/[^+\d]/g,'');
      render();
    };
    var okBtn=el('<button class="icon-btn success">✓</button>');
    okBtn.onclick=function(){ STATE.modal={type:'action', contactId:c.id, actionType:'success'}; render(); };
    var noBtn=el('<button class="icon-btn fail">✕</button>');
    noBtn.onclick=function(){ STATE.modal={type:'action', contactId:c.id, actionType:'fail'}; render(); };
    actions.appendChild(callBtn); actions.appendChild(okBtn); actions.appendChild(noBtn);
    row.appendChild(actions);
  }
  return row;
}

async function recordEntry(userId, count){
  var existing=STATE.entries.find(function(e){ return e.userId===userId && e.date===todayStr(); });
  if(existing){ existing.count=count; }
  else{ STATE.entries.push({ id:uid(), userId:userId, date:todayStr(), count:count }); }
  await saveEntries();
}

  var all=STATE.users.slice().sort(function(a,b){
    var order={admin:0, assistant:1, agent:2};
    if(order[a.role]!==order[b.role]) return order[a.role]-order[b.role];
    return a.name.localeCompare(b.name,'ar');
  });

        var delBtn=el('<button class="btn danger" style="padding:7px 12px; font-size:12px;">Supprimer</button>');
        delBtn.onclick=async function(){
          if(!confirm('Supprimer '+u.name+' de l\'équipe ? Son historique ne sera pas supprimé.')) return;

      var pos=searchInput.selectionStart;
      clearTimeout(browseSearchDebounce);

        STATE.browseSearchQuery=v; STATE.browseTableLimit=100; render();
        var el2=document.getElementById('browse-search-input');
        if(el2){ el2.focus(); try{ el2.setSelectionRange(pos,pos); }catch(e){} }

    };
    browseCard.appendChild(searchInput);

    var batchFilterSel=document.createElement('select');
    batchFilterSel.style.marginBottom='10px';
    batchFilterSel.appendChild(el('<option value="">— Toutes les listes —</option>'));
    (typeof batchList!=='undefined' ? batchList : []).forEach(function(b){
      var isArch = b.contacts.every(function(c){ return c.archived; });
      var o=document.createElement('option'); o.value=b.id; o.textContent=b.label+(isArch?' (archivée)':'')+' ('+b.contacts.length+')';
      if(STATE.browseBatchFilter===b.id) o.selected=true;
      batchFilterSel.appendChild(o);
    });
    batchFilterSel.onchange=function(){ STATE.browseBatchFilter=batchFilterSel.value; STATE.browseTableLimit=100; render(); };
    browseCard.appendChild(batchFilterSel);

    var q=(STATE.browseSearchQuery||'').trim().toLowerCase();
    var filteredContacts = monthContacts.filter(function(c){
      var matchesQ = !q || (c.name||'').toLowerCase().indexOf(q)!==-1 || (c.phone||'').toLowerCase().indexOf(q)!==-1;
      var matchesBatch = !STATE.browseBatchFilter || (c.batchId||'legacy')===STATE.browseBatchFilter;
      return matchesQ && matchesBatch;
    });

    var limit=STATE.browseTableLimit;
    var visibleContacts=filteredContacts.slice(0, limit);

    var btbl=document.createElement('table');
    btbl.innerHTML='<thead><tr><th>Nom</th><th>Liste</th><th>Assigné à</th><th>Statut</th><th>Durée</th><th>Vérification</th><th></th></tr></thead>';
    var btbody=document.createElement('tbody');
    visibleContacts.forEach(function(c){
      var tr=document.createElement('tr');
      var tdName=document.createElement('td');
      var nameInput=document.createElement('input');
      nameInput.value=c.name||''; nameInput.style.fontSize='12.5px'; nameInput.style.padding='6px 8px'; nameInput.style.minWidth='110px';
      nameInput.onchange=async function(){ c.name=nameInput.value.trim(); await saveCalllistItems([c]); showToast('Mis à jour'); };
      tdName.appendChild(nameInput);
      var tdBatch=document.createElement('td');
      tdBatch.innerHTML='<span class="faint" style="font-size:11px;">'+escapeHtml(c.batchLabel||'—')+(c.archived?' 📦':'')+'</span>';
      var tdAssign=document.createElement('td');
      var sel=document.createElement('select');
      sel.style.fontSize='12px'; sel.style.padding='6px 8px';
      sel.appendChild(el('<option value="">— Non attribué —</option>'));
      agentsInTeam.forEach(function(a){
        var o=document.createElement('option'); o.value=a.id; o.textContent=a.name;
        if(c.assignedTo===a.id) o.selected=true;
        sel.appendChild(o);
      });
      sel.onchange=async function(){
        var oldAgent=c.assignedTo;
        c.assignedTo = sel.value || null;
        var prevMap={}; prevMap[c.id]=oldAgent;
        await saveCalllistItems([c], prevMap);
        showToast('Mis à jour');
      };
      tdAssign.appendChild(sel);
      var tdStatus=document.createElement('td');
      var pillClass = c.status==='pending'?'pending':(c.status==='success'?'success':'failed');
      var pillLabel = c.status==='pending'?RL.pendingStatus:(c.status==='success'?RL.success:RL.failed);
      tdStatus.innerHTML='<span class="status-pill '+pillClass+'">'+pillLabel+'</span>';
      var tdDur=document.createElement('td');
      tdDur.innerHTML = c.callDurationSeconds!=null ? (fmtDurationFr(c.callDurationSeconds)+(c.autoTimed===false?' <span style="color:#B5514B;">⚠</span>':'')) : '—';
      var tdVerify=document.createElement('td');
      if(c.status==='pending'){ tdVerify.innerHTML='—'; }
      else {
        var vBtn=el('<button class="btn '+(c.verified?'secondary':'ghost')+'" style="padding:5px 10px; font-size:11px;">'+(c.verified?'✓ Vérifié':'Vérifier')+'</button>');
        vBtn.onclick=async function(){ c.verified=!c.verified; await saveCalllistItems([c]); render(); };
        tdVerify.appendChild(vBtn);
      }
      var tdDel=document.createElement('td');
      var delRowBtn=el('<button class="btn danger" style="padding:5px 9px; font-size:11px;">Supprimer</button>');
      delRowBtn.onclick=async function(){
        if(!confirm('Supprimer '+(c.name||'ce contact')+' définitivement ?')) return;
        STATE.calllists = STATE.calllists.filter(function(x){ return x.id!==c.id; });
        await deleteCalllistItems([c]);
        showToast('Supprimé ✓');
        render();
      };
      tdDel.appendChild(delRowBtn);
      tr.appendChild(tdName); tr.appendChild(tdBatch); tr.appendChild(tdAssign); tr.appendChild(tdStatus); tr.appendChild(tdDur); tr.appendChild(tdVerify); tr.appendChild(tdDel);
      btbody.appendChild(tr);
    });
    btbl.appendChild(btbody);
    var bwrap=el('<div class="preview-table-wrap"></div>');
    bwrap.appendChild(btbl);
    browseCard.appendChild(bwrap);

    if(filteredContacts.length>limit){
      var loadMoreBtn=el('<button class="btn secondary block" style="margin-top:10px;">Afficher plus ('+(filteredContacts.length-limit)+' restants)</button>');
      loadMoreBtn.onclick=function(){ STATE.browseTableLimit+=100; render(); };
      browseCard.appendChild(loadMoreBtn);
    } else if(filteredContacts.length===0){
      browseCard.appendChild(el('<div class="faint" style="margin-top:8px;">Aucun résultat pour cette recherche</div>'));
    }

    wrap.appendChild(browseCard);
  }

  return wrap;
}

function handleFileImport(file, listType){
  if(!file) return;
  if(typeof XLSX === 'undefined'){ showToast('Impossible de charger l\'outil Excel, vérifiez la connexion internet'); return; }
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=new Uint8Array(e.target.result);
      var workbook=XLSX.read(data, {type:'array'});
      var sheet=workbook.Sheets[workbook.SheetNames[0]];
      var raw=XLSX.utils.sheet_to_json(sheet, {defval:''});
      if(!raw.length){ showToast('Le fichier est vide ou illisible'); return; }

      var keys=Object.keys(raw[0]);
      function findKey(patterns){
        return keys.find(function(k){
          var kk=String(k).trim();
          return patterns.some(function(p){ return kk.indexOf(p)!==-1; });
        });
      }
      var nameKey = findKey(['اسم','Name','name','الزبون','العميل']);
      var phoneKey = findKey(['هاتف','جوال','رقم','Phone','phone','Mobile','mobile']);
      var accKey = findKey(['حساب','Account','account']);

      var rows = raw.map(function(r){
        return {
          name: nameKey ? String(r[nameKey]).trim() : String(r[keys[0]]||'').trim(),
          phone: phoneKey ? String(r[phoneKey]).trim() : (keys[1] ? String(r[keys[1]]||'').trim() : ''),
          accountNo: accKey ? String(r[accKey]).trim() : '',
          note: (!nameKey || !phoneKey) ? 'Détecté automatiquement — vérifiez les colonnes' : ''
        };
      }).filter(function(r){ return r.name || r.phone; });

      STATE.importPreview = { listType:listType, rows:rows };
      render();
    }catch(err){
      showToast('Impossible de lire le fichier — vérifiez qu\'il s\'agit d\'un Excel valide');
    }
  };
  reader.readAsArrayBuffer(file);
}

function frMonthLabel(ym){
  var names=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  var parts=ym.split('-');
  return names[parseInt(parts[1])-1]+' '+parts[0];
}
function fmtDurationFr(totalSeconds){
  totalSeconds=totalSeconds||0;
  var h=Math.floor(totalSeconds/3600), m=Math.floor((totalSeconds%3600)/60), s=totalSeconds%60;
  if(h>0) return h+'h '+m+'min '+s+'s';
  if(m>0) return m+'min '+s+'s';
  return s+'s';
}
function frStatus(status){ return status==='success'?RL.success : status==='failed'?RL.failed : RL.pendingStatus; }

function renderSummaryReport(){

  var sel=document.createElement('select');
  months.forEach(function(m){ var o=document.createElement('option'); o.value=m; o.textContent=arabicMonthLabel(m); sel.appendChild(o); });
  sel.value = STATE._reportMonth || currentMonthKey();
  sel.onchange=function(){ STATE._reportMonth=sel.value; render(); };
  pickCard.appendChild(sel);
  container.appendChild(pickCard);

  var month = STATE._reportMonth || currentMonthKey();
  var agents=agentsOnly();
  var actTot=teamMonthTotal('تفعيل', month), useTot=teamMonthTotal('استخدام', month);
  var counts=reasonCounts(month);
  var reasonEntries=Object.keys(counts).map(function(k){ return {reason:k, count:counts[k]}; }).sort(function(a,b){ return b.count-a.count; });

  var printArea=el('<div class="report-print"></div>');
  printArea.appendChild(el(
    '<div class="faint" style="font-size:11.5px;">'+escapeHtml(BANK_NAME_FR)+'</div>'+
    '<div class="section-title" style="font-size:15px;">'+RL.summaryTitle+' — '+frMonthLabel(month)+'</div>'
  ));

  var summaryCard=el('<div class="card" style="margin-bottom:14px;"></div>');
  summaryCard.appendChild(el(
